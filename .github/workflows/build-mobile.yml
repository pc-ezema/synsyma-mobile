name: Build Mobile

on:
  workflow_dispatch:
  push:
    branches: [dev, prod]

jobs:
  android:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
    concurrency: build-mobile-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Add Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 -d > android/app/google-services.json
      - run: flutter analyze --no-fatal-infos

      # ---- DIAGNOSTIC: what does CI see? ----
      - name: Debug env file
        run: |
          echo "=== pwd ===" && pwd
          echo "=== ls env/ ===" && ls -la env/
          echo "=== cat env/dev.json ===" && cat env/dev.json
          echo "=== flutter --version ===" && flutter --version

      # dev branch: unsigned APK
      - name: Build dev APK
        if: github.ref_name == 'dev'
        run: flutter build apk --release --dart-define-from-file=env/dev.json --build-number=${{ github.run_number }}

      - name: Show what the built APK is allowed to do
        if: github.ref_name == 'dev'
        run: |
          AAPT="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt"
          ls -la build/app/outputs/flutter-apk/
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk
          echo "=== main manifest in the repo ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: Upload dev APK
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-dev-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # prod branch: signed bundle for Google Play
      - name: Set up signing
        if: github.ref_name == 'prod'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build prod bundle
        if: github.ref_name == 'prod'
        run: flutter build appbundle --release --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}

      - name: Upload prod bundle
        if: github.ref_name == 'prod'
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-prod-aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
    concurrency: build-mobile-ios-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Add Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > ios/Runner/GoogleService-Info.plist

      - run: flutter analyze --no-fatal-infos

      # dev branch: compile check, unsigned (cannot be installed on a phone)
      - name: Build dev (unsigned)
        if: github.ref_name == 'dev'
        run: flutter build ios --release --no-codesign --dart-define-from-file=env/dev.json --build-number=${{ github.run_number }}

      # prod branch: signed IPA, uploaded to TestFlight
      - name: Install signing certificate and profile
        if: github.ref_name == 'prod'
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Write export options
        if: github.ref_name == 'prod'
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${{ secrets.IOS_BUNDLE_ID }}</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          EOF

      - name: Build prod IPA
        if: github.ref_name == 'prod'
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}

      - name: Upload prod IPA artifact
        if: github.ref_name == 'prod'
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-prod-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        if: github.ref_name == 'prod'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"