name: Build Mobile

on:
  workflow_dispatch:
  push:
    branches: [dev, prod]

jobs:
  android:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
    concurrency: build-mobile-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Add Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 -d > android/app/google-services.json
      - run: flutter analyze --no-fatal-infos

      # ---- DIAGNOSTIC: what does CI see? ----
      - name: Debug env file
        run: |
          echo "=== pwd ===" && pwd
          echo "=== ls env/ ===" && ls -la env/
          echo "=== cat env/dev.json ===" && cat env/dev.json
          echo "=== flutter --version ===" && flutter --version

      # dev branch: unsigned APK
      - name: Build dev APK
        if: github.ref_name == 'dev'
        run: flutter build apk --release --dart-define-from-file=env/dev.json --build-number=${{ github.run_number }}

      - name: Show what the built APK is allowed to do
        if: github.ref_name == 'dev'
        run: |
          AAPT="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt"
          ls -la build/app/outputs/flutter-apk/
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk
          echo "=== main manifest in the repo ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: Upload dev APK
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-dev-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # prod branch: signed bundle for Google Play
      - name: Set up signing
        if: github.ref_name == 'prod'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build prod bundle
        if: github.ref_name == 'prod'
        run: flutter build appbundle --release --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}

      - name: Upload prod bundle
        if: github.ref_name == 'prod'
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-prod-aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
    concurrency: build-mobile-ios-${{ github.ref_name }}
    env:
      BUNDLE_ID: com.synsyma.app
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Add Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > ios/Runner/GoogleService-Info.plist

      - run: flutter analyze --no-fatal-infos

      - name: Install Codemagic CLI tools
        run: pip3 install --break-system-packages codemagic-cli-tools

      - name: Set up signing
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo '${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}' | base64 -d)"
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        run: |
          ENVFILE=env/dev.json
          if [ "${{ github.ref_name }}" = "prod" ]; then ENVFILE=env/prod.json; fi
          flutter build ipa --release \
            --build-number=$((${{ github.run_number }} + 100)) \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define-from-file="$ENVFILE"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-ipa-${{ github.ref_name }}
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo '${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}' | base64 -d)"
          app-store-connect publish --path build/ios/ipa/*.ipa