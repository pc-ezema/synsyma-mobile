name: Build Mobile

on:
  workflow_dispatch:
  push:
    branches: [dev, prod]

jobs:
  android:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
    concurrency: build-mobile-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

       # ---- DIAGNOSTIC: what does CI see? ----
      - name: Debug env file
        run: |
          echo "=== pwd ===" && pwd
          echo "=== ls env/ ===" && ls -la env/
          echo "=== cat env/dev.json ===" && cat env/dev.json
          echo "=== flutter --version ===" && flutter --version

      - name: Show what the built APK is allowed to do
        if: github.ref_name == 'dev'
        run: |
          AAPT="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk
          echo "=== main manifest in the repo ==="
          cat android/app/src/main/AndroidManifest.xml

      # dev branch: installable APK for testers
      - name: Build dev APK
        if: github.ref_name == 'dev'
        run: flutter build apk --release --dart-define-from-file=env/dev.json --build-number=${{ github.run_number }}

      - name: Verify API_URL baked into APK
        if: github.ref_name == 'dev'
        run: |
          set -e
          echo "=== Checking libapp.so for API_URL ==="
          unzip -p build/app/outputs/flutter-apk/app-release.apk \
            lib/arm64-v8a/libapp.so \
            | strings | grep -i "dev-api.synsyma.com" \
            && echo "✅ URL present in APK" \
            || (echo "❌ URL MISSING from APK — dart-define not applied"; exit 1)
            
      - name: Upload dev APK
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-dev-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # prod branch: signed bundle for Google Play
      - name: Set up signing
        if: github.ref_name == 'prod'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build prod bundle
        if: github.ref_name == 'prod'
        run: flutter build appbundle --release --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}

      - name: Upload prod bundle
        if: github.ref_name == 'prod'
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-prod-aab
          path: build/app/outputs/bundle/release/app-release.aab