name: Build Mobile

on:
  workflow_dispatch:
  push:
    branches: [dev, prod]

jobs:
  android:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
    concurrency: build-mobile-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # dev branch: installable APK for testers
      - name: Build dev APK
        if: github.ref_name == 'dev'
        run: flutter build apk --release --dart-define-from-file=env/dev.json --build-number=${{ github.run_number }}

      - name: Upload dev APK
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-dev-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # prod branch: signed bundle for Google Play
      - name: Set up signing
        if: github.ref_name == 'prod'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build prod bundle
        if: github.ref_name == 'prod'
        run: flutter build appbundle --release --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}

      - name: Upload prod bundle
        if: github.ref_name == 'prod'
        uses: actions/upload-artifact@v4
        with:
          name: synsyma-prod-aab
          path: build/app/outputs/bundle/release/app-release.aab