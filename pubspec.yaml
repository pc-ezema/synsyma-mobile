name: synsyma_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#020F28"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  background_color_ios: "020F28"

# iOS launch screen (replaces the placeholder image)
flutter_native_splash:
  color: "#020F28"
  image: assets/splash/logo.png
  ios: true
  android: false
  web: false

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  url_launcher: ^6.3.3
  local_auth: ^3.0.2
  flutter_stripe: ^14.2.0
  intl: ^0.20.3
  app_badge_plus: ^1.4.0
  cached_network_image: ^3.4.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/splash/